name: Horarios EMT

# Regenera cada día los horarios por parada a partir del GTFS oficial de la EMT
# y los publica en la rama «datos», de donde los descarga la app.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  horarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar GTFS
        run: python3 tools/download_gtfs.py gtfs.zip

      - name: Generar un JSON por parada
        run: python3 tools/gtfs_to_stops.py gtfs.zip out

      - name: Publicar en la rama datos
        working-directory: out
        run: |
          git init -q -b datos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'Horarios por parada de la EMT de València generados a partir del GTFS oficial\n(Ajuntament de València / EMT, CC BY 4.0). No editar a mano.\n' > README.md
          git add -A
          git commit -qm "Horarios EMT $(jq -r .version index.json)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" datos
